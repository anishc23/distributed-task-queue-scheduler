name: Publish research site

# Builds web/ and publishes it to GitHub Pages. Runs only when started by hand:
# publishing a public page is a deliberate act, not a side effect of a push.
#
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
# Then: Actions -> "Publish research site" -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      # A project site is served under /<repository>/, so asset URLs must be too.
      - run: npm run build
        env:
          BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
