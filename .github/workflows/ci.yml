name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.23"

jobs:
  lint:
    name: Format and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go'))
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d $(echo "$unformatted")
            exit 1
          fi
          echo "gofmt: clean"

      - name: go vet
        run: |
          go vet ./...
          go vet -tags integration ./...

      # staticcheck catches what vet does not: unused code, impossible type
      # assertions, misuse of the standard library. Pinned, because a linter
      # that silently gains rules turns an unrelated push into a red build.
      - name: staticcheck
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
          go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 -tags integration ./...

      - name: go mod tidy is up to date
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test with the race detector
        run: go test -race -count=1 ./...

      - name: Coverage summary
        run: |
          go test -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -20

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    # A real Redis 7, which is what the integration tests are written against.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run integration tests
        env:
          TQ_TEST_REDIS_ADDR: localhost:6379
        run: go test -tags integration -race -count=1 -timeout 20m ./...

  benchmark-smoke:
    name: Benchmark smoke run
    runs-on: ubuntu-latest
    needs: [unit]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analysis dependencies
        run: python -m pip install --quiet -r requirements.txt

      # A reduced matrix keeps CI fast while still exercising every scheduler,
      # every workload, the CSV writers and the plotting script end to end.
      - name: Run the benchmark matrix
        run: |
          go run ./cmd/benchmark \
            --config experiments/quick.yaml \
            --redis-addr localhost:6379 \
            --run-id ci \
            --count 120 \
            --workers 2 --concurrency 4 \
            --repetitions 1 \
            --results-dir results

      - name: Generate plots
        run: python scripts/plot_results.py --results-dir results --run ci

      - name: Check every experiment completed
        run: |
          python - <<'PY'
          import csv, sys
          rows = list(csv.DictReader(open("results/ci/aggregate.csv")))
          assert len(rows) == 16, f"expected 16 experiments, got {len(rows)}"
          bad = [r for r in rows if r["timed_out"] == "true"]
          assert not bad, f"experiments timed out: {[ (r['scheduler'], r['workload']) for r in bad ]}"
          short = [r for r in rows if int(r["tasks_completed"]) + int(r["tasks_dead_lettered"]) < int(r["tasks_planned"])]
          assert not short, f"experiments lost tasks: {[ (r['scheduler'], r['workload']) for r in short ]}"
          print(f"all {len(rows)} experiments completed every task")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results/ci
          retention-days: 7

  docker:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f deploy/docker/Dockerfile -t distributed-task-queue:ci .

      - name: Every binary runs in the image
        run: |
          for bin in scheduler worker producer benchmark tqctl; do
            echo "--- $bin --help"
            docker run --rm distributed-task-queue:ci "$bin" --help 2>&1 | head -5 || true
          done

  manifests:
    name: Kubernetes manifests render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render base and overlay
        run: |
          kubectl kustomize deploy/kubernetes/base > /tmp/base.yaml
          kubectl kustomize deploy/kubernetes/overlays/wfq > /tmp/wfq.yaml
          test -s /tmp/base.yaml
          test -s /tmp/wfq.yaml
          grep -q -- '--policy=wfq' /tmp/wfq.yaml
          echo "manifests render and the overlay applies the wfq policy"

      # The scheduler's single-writer invariant is enforced by the lease, not by
      # replicas: 1. If a change ever leaves two replicas running with election
      # off, two schedulers rank against divergent virtual clocks and nothing
      # fails loudly, so the check belongs in CI rather than in a reviewer's head.
      - name: Scheduler high availability is coherent
        run: |
          python3 - <<'PY'
          import re, sys

          docs = open("/tmp/base.yaml").read().split("\n---\n")

          def find(kind, name):
              for d in docs:
                  if re.search(r"^kind: %s$" % kind, d, re.M) and re.search(r"^  name: %s$" % name, d, re.M):
                      return d
              return None

          dep = find("Deployment", "scheduler")
          if dep is None:
              sys.exit("scheduler Deployment not found in the rendered base")
          replicas = int(re.search(r"^  replicas: (\d+)$", dep, re.M).group(1))

          cm = find("ConfigMap", "taskqueue-config")
          if cm is None:
              sys.exit("taskqueue-config ConfigMap not found")
          block = re.search(r"leader_election:\n(?:\s+#.*\n|\s+\w+:.*\n)+", cm)
          elected = bool(block) and re.search(r"enabled:\s*true", block.group(0)) is not None

          if replicas > 1 and not elected:
              sys.exit("scheduler runs %d replicas with leader election off: two schedulers would rank against divergent virtual clocks" % replicas)
          if find("PodDisruptionBudget", "scheduler") is None:
              sys.exit("scheduler has no PodDisruptionBudget, so a node drain can take every replica at once")
          print("scheduler: %d replicas, leader election enabled=%s, PDB present" % (replicas, elected))
          PY

      - name: Shell scripts are syntactically valid
        run: |
          bash -n scripts/kind-up.sh
          bash -n scripts/kind-down.sh
