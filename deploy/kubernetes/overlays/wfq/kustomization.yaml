# Overlay that switches the deployed scheduler to weighted fair queuing and
# gives tenant A a larger weight, without touching producers or workers.
#
#   kubectl apply -k deploy/kubernetes/overlays/wfq
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: taskqueue

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: scheduler
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --policy=wfq
