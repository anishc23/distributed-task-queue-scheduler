apiVersion: v1
kind: Service
metadata:
  name: scheduler
  labels:
    app.kubernetes.io/name: scheduler
    app.kubernetes.io/part-of: taskqueue
spec:
  selector:
    app.kubernetes.io/name: scheduler
  ports:
    - name: metrics
      port: 9101
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  labels:
    app.kubernetes.io/name: scheduler
    app.kubernetes.io/part-of: taskqueue
spec:
  # The scheduler is a single-writer component: it owns the pending index and
  # the WFQ virtual clock. Running more than one replica would let two processes
  # rank tasks against divergent virtual time, so replicas is pinned to 1 and
  # the strategy is Recreate to avoid a brief overlap during rollouts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduler
        app.kubernetes.io/part-of: taskqueue
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: scheduler
          image: distributed-task-queue:dev
          imagePullPolicy: IfNotPresent
          command: ["scheduler"]
          args:
            - --config=/etc/taskqueue/config.yaml
            - --metrics-addr=:9101
          env:
            - name: TQ_LOG_FORMAT
              value: json
          ports:
            - name: metrics
              containerPort: 9101
          volumeMounts:
            - name: config
              mountPath: /etc/taskqueue
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: taskqueue-config
