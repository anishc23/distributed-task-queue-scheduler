# Pandoc layout settings for docs/report.md.
#
# These live outside the Markdown on purpose: GitHub renders YAML front matter
# as a metadata table at the top of the rendered file, which would show PDF
# plumbing (page geometry, font size, link colours) to anyone reading the report
# on the web. Keeping them here means the Markdown stays clean for readers and
# the PDF still gets its layout.
#
